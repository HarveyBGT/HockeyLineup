name: HockeyLineup
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ITSAppUsesNonExemptEncryption: false

targets:
  HockeyLineup:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: Fortress
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hockeylineup
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true

  HockeyLineupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HockeyLineupTests
    dependencies:
      - target: HockeyLineup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  HockeyLineup:
    build:
      targets:
        HockeyLineup: all
        HockeyLineupTests: [test]
    test:
      config: Debug
      targets:
        - HockeyLineupTests
    run:
      config: Debug
    archive:
      config: Release
