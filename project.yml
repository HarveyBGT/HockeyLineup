name: HockeyLineup
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ITSAppUsesNonExemptEncryption: false

targets:
  HockeyLineup:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: Fortress
        NSCalendarsFullAccessUsageDescription: Add fixtures to your calendar with the match time, venue, and a kickoff reminder.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hockeylineup
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: Resources/HockeyLineup.entitlements
    dependencies:
      - target: FortressWidgetExtension
        embed: true

  FortressWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/FortressWidget
      - path: Sources/Models/LeagueData.swift
      - path: Sources/Models/PitchVenue.swift
      - path: Sources/Models/MatchResult.swift
      - path: Sources/Models/MatchActivityAttributes.swift
      - path: Sources/Extensions/Theme.swift
      - path: Sources/Extensions/Color+Hex.swift
    info:
      path: Generated/FortressWidgetExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hockeylineup.FortressWidget
        PRODUCT_NAME: FortressWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: false

  HockeyLineupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HockeyLineupTests
    dependencies:
      - target: HockeyLineup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  HockeyLineup:
    build:
      targets:
        HockeyLineup: all
        HockeyLineupTests: [test]
    test:
      config: Debug
      targets:
        - HockeyLineupTests
    run:
      config: Debug
    archive:
      config: Release
